<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Delhi Palace</title>
<style>
  :root { --choc:#231210; --caramel:#8b5e3c; --cream:#fdf4df; --gold:#b17500; --sand:#edc775; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px;
         background:var(--caramel); color:var(--cream);
         font-family:"Georgia","Times New Roman",serif; text-align:center; }
  .card { max-width:520px; background:var(--choc); border:1px solid var(--gold);
          border-radius:18px; padding:44px 32px; }
  .eyebrow { letter-spacing:.28em; text-transform:uppercase; font-size:12px; color:#ffe594; margin:0 0 14px; }
  h1 { margin:0 0 14px; font-size:34px; line-height:1.15; }
  p { margin:0 0 26px; line-height:1.65; opacity:.9; font-size:16px; }
  a.btn { display:inline-block; padding:13px 30px; border-radius:999px;
          background:var(--sand); color:var(--choc); text-decoration:none; font-weight:700;
          font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Delhi Palace</p>
    <h1>That page has moved on</h1>
    <p>We could not find the page you were after. Head back to the home page and we will point you in the right direction.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
