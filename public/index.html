<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Delhi Palace | Staging</title>
<style>
  :root { --choc:#231210; --caramel:#8b5e3c; --cream:#fdf4df; --gold:#b17500; --sand:#edc775; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px;
         background:var(--caramel); color:var(--cream);
         font-family:"Georgia","Times New Roman",serif; text-align:center; }
  .card { max-width:560px; background:var(--choc); border:1px solid var(--gold);
          border-radius:18px; padding:48px 34px; }
  .eyebrow { letter-spacing:.28em; text-transform:uppercase; font-size:12px; color:#ffe594; margin:0 0 14px; }
  h1 { margin:0 0 16px; font-size:36px; line-height:1.15; }
  p { margin:0 0 14px; line-height:1.65; opacity:.9; font-size:16px; }
  code { background:rgba(237,199,117,.14); color:var(--sand); padding:2px 7px;
         border-radius:5px; font-size:14px; }
  .rule { height:1px; background:var(--gold); opacity:.5; margin:28px 0; }
  .note { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; opacity:.65; margin:0; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Delhi Palace</p>
    <h1>Staging is live</h1>
    <p>The deploy pipeline is connected and working. This placeholder is served from <code>public/index.html</code> in the repo.</p>
    <div class="rule"></div>
    <p class="note">Drop the real pages into <code>public/</code> and push to <code>main</code>. They replace this page on the next deploy.</p>
  </div>
</body>
</html>
